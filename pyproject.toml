[project]
name = "mathlint"
description = "A linter for your math: finds the first wrong step in a worked solution."
readme = "README.md"
requires-python = ">=3.10"
license = "PolyForm-Noncommercial-1.0.0"
authors = [{ name = "happy2rave" }]
keywords = ["math", "education", "sympy", "calculus", "homework", "symbolic"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Education",
    "License :: Other/Proprietary License",
    "Programming Language :: Python :: 3",
    "Topic :: Education",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = ["sympy>=1.12"]
dynamic = ["version"]

[project.urls]
Homepage = "https://github.com/happy2rave/mathlint"
Issues = "https://github.com/happy2rave/mathlint/issues"
Donate = "https://buymeacoffee.com/happy2rave"
License = "https://github.com/happy2rave/mathlint/blob/main/LICENSE"

[project.scripts]
mathlint = "mathlint.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/mathlint/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/mathlint"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# a space-separated list of function names reads better than 30 quoted strings
ignore = ["SIM905"]
