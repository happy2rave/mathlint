name: Bug report
description: Something crashed, hung, or behaved differently than documented.
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How to reproduce it
      description: The exact command or code, and the input you used.
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected instead
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version and platform
      description: "For example: mathlint 0.1.0, Python 3.12, Windows 11 — or Firefox on the web page."
    validations:
      required: true
